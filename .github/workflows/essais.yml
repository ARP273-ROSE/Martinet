name: essais

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 poppler-utils
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Essais sur le vrai système
        run: python -m pytest -q -rs tests/test_windows.py tests/test_moteur.py tests/test_fenetre.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Bilan en ligne de commande
        run: python run.py --verifier --lang fr
        env:
          MARTINET_DEMO: '0'

  manjaro:
    # le mode Linux sur un vrai Manjaro : pamac, paccache, pacman, flatpak, fwupd répondent pour de vrai
    runs-on: ubuntu-latest
    container: manjarolinux/base:latest
    steps:
      - uses: actions/checkout@v4
      - run: pacman -Syu --noconfirm --needed python python-pyqt6 python-pytest pamac-cli pacman-contrib flatpak fwupd
      - name: Bilan en ligne de commande (vrai système)
        run: python run.py --verifier --lang fr
        env:
          MARTINET_DEMO: '0'
          QT_QPA_PLATFORM: offscreen
      - run: python -m pytest -q tests/test_linux.py
        env:
          QT_QPA_PLATFORM: offscreen
